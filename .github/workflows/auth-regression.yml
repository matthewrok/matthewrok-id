name: Authentication regression tests

on:
  pull_request:
    paths:
      - "assets/js/auth.js"
      - "assets/js/access-guard.js"
      - "assets/js/session-manager.js"
      - "assets/js/supabase.js"
      - "assets/js/home-orders.js"
      - "assets/js/joki-matthew.js"
      - "assets/js/admin-joki-progress.js"
      - "assets/js/worker-application.js"
      - "assets/js/maintenance-status.js"
      - "assets/js/maintenance-admin.js"
      - "assets/css/blue-theme.css"
      - "index.html"
      - "login.html"
      - "register.html"
      - "reset-password.html"
      - "email-confirmed.html"
      - "login/**"
      - "register/**"
      - "reset-password/**"
      - "email-confirmed/**"
      - "404.html"
      - "member-dashboard.html"
      - "worker.html"
      - "inbox.html"
      - "your-order.html"
      - "maintenance.html"
      - "joki-matthew.html"
      - "admin/dashboard.html"
      - "admin/joki-progress.html"
      - "calculator-resource.html"
      - "requirements-city-hall.html"
      - "member-rewards.html"
      - "member-benefits.html"
      - "member-membership-history.html"
      - "assets/js/membership-history.js"
      - "supabase/matthew-membership-history.sql"
      - "assets/js/admin-features.js"
      - "supabase/matthew-early-access-promo.sql"
      - "supabase/matthew-referral-system.sql"
      - "supabase/tracking-token-v2.sql"
      - "supabase/tracking-token-v2-cutover.sql"
      - "supabase/tracking-token-v2-rollback.sql"
      - "supabase/harden_remaining_rpc_search_paths.sql"
      - "supabase/harden_legacy_order_rpc_role_access.sql"
      - "supabase/consolidate_permissive_rls_policies.sql"
      - "supabase/remove_unused_anon_voucher_policy.sql"
      - "supabase/maintenance-mode-v2.sql"
      - "supabase/maintenance-mode-service-role-read.sql"
      - "supabase/maintenance-mode-inbox-rls.sql"
      - "supabase/maintenance-mode-telegram-rpc.sql"
      - "supabase/harden_admin_helpers_active_status.sql"
      - "supabase/add_maintenance_foreign_key_indexes.sql"
      - "supabase/admin-role-management.sql"
      - "supabase/functions/inbox-send/**"
      - "supabase/functions/telegram-order-notify/**"
      - "supabase/functions/worker-application-submit/**"
      - "tests/**"
      - "deno.json"
      - ".github/workflows/auth-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-regression:
    name: Login redirect, session cleanup, and role access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run authentication regression tests
        run: node --test tests/*.test.cjs
      # Install Deno from the npm registry to avoid transient GitHub Release
      # download failures (HTTP 5xx) in denoland/setup-deno.
      - name: Set up Deno
        run: |
          npm install --global deno@2.9.6
          deno --version
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/worker-application-submit/index.ts supabase/functions/telegram-order-notify/index.ts supabase/functions/inbox-send/index.ts
