name: iOS App

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-app.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build MATTHEW JOKI for iPhone and iPad
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iOS Simulator target
        run: |
          xcodebuild -project ios/MATTHEWJOKI.xcodeproj -scheme MATTHEWJOKI \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS device archive
        run: |
          xcodebuild -project ios/MATTHEWJOKI.xcodeproj -scheme MATTHEWJOKI \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -archivePath /tmp/MATTHEWJOKI.xcarchive CODE_SIGNING_ALLOWED=NO archive
