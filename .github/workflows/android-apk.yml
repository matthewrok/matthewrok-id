name: Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and publish MATTHEW JOKI debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate launcher icons from Matthew brand logo
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 android/scripts/generate_launcher_icons.py

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matthew-joki-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke-test:
    name: Android emulator smoke test
    runs-on: ubuntu-24.04
    needs: build-debug-apk
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate launcher icons from Matthew brand logo
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 android/scripts/generate_launcher_icons.py

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 18
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android
            adb logcat -c
            adb logcat -v threadtime > ../android-emulator-logcat.txt &
            LOGCAT_PID=$!
            set +e
            gradle connectedDebugAndroidTest --no-daemon --stacktrace
            TEST_EXIT_CODE=$?
            set -e
            kill "$LOGCAT_PID" 2>/dev/null || true
            wait "$LOGCAT_PID" 2>/dev/null || true
            if [ "$TEST_EXIT_CODE" -ne 0 ]; then
              echo "::group::Android emulator diagnostics (crash and instrumentation events)"
              grep -Ei "FATAL EXCEPTION|AndroidRuntime|Process:|INSTRUMENTATION|Instrumentation|am_crash|am_anr|Process .* has died|crash_dump" ../android-emulator-logcat.txt | tail -n 300 || true
              echo "::endgroup::"
              exit "$TEST_EXIT_CODE"
            fi

      - name: Upload emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: android-emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 7
