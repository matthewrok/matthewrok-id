<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Lihat daftar pesanan MATTHEW JOKI, salin kode pesanan, dan periksa detail serta progresnya.">
    <title>Your Order | MATTHEW JOKI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #0a0a0a;
            --bg-input: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #262626;
            --accent-gold: #d4af37;
            --status-success: #10b981;
            --status-process: #f59e0b;
            --status-cancel: #ef4444;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background-color: var(--bg-main); color: var(--text-main); padding-bottom: 40px; overflow-x: hidden; }
        .container { max-width: 480px; margin: 0 auto; padding: 30px 15px 15px 15px; }

        /* HEADER SECTION */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .page-title h1 { font-family: var(--font-serif); font-size: 24px; color: white; margin-bottom: 4px; line-height: 1.1; }
        .page-title p { font-size: 11px; color: var(--text-muted); }
        
        /* REFRESH BUTTON (Minimalis) */
        .btn-refresh { 
            background: transparent; 
            border: 1px solid var(--border-color); 
            color: var(--text-muted); 
            width: 32px; 
            height: 32px; 
            border-radius: 6px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .btn-refresh:hover { 
            background: var(--bg-card); 
            color: var(--accent-gold); 
            border-color: var(--accent-gold); 
        }
        .btn-refresh svg { 
            width: 16px; 
            height: 16px; 
        }
        
        /* FILTER TABS */
        .filter-tabs { display: flex; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; margin-bottom: 20px; }
        .filter-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 10px 0; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.3s; }
        .filter-btn.active { background: #1a1a1a; color: var(--accent-gold); }

        /* LIST CONTAINER */
        #ordersList { display: flex; flex-direction: column; gap: 15px; }

        /* KARTU PESANAN */
        .order-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
        .order-card:hover { border-color: rgba(212, 175, 55, 0.4); transform: translateY(-2px); }
        .order-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--accent-gold); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 18px 15px 18px; border-bottom: 1px dashed var(--border-color); background: rgba(255,255,255,0.02); }
        .card-header h3 { font-family: var(--font-serif); font-size: 18px; color: white; line-height: 1.2; margin-bottom: 4px; }
        
        /* Badges */
        .badge-group { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
        .status-badge { font-size: 9px; font-weight: 600; text-transform: uppercase; padding: 4px 8px; border-radius: 20px; border: 1px solid; letter-spacing: 0.5px; white-space: nowrap; }
        .status-success { background: rgba(16, 185, 129, 0.1); border-color: var(--status-success); color: var(--status-success); }
        .status-process { background: rgba(245, 158, 11, 0.1); border-color: var(--status-process); color: var(--status-process); }
        
        .payment-badge { font-size: 9px; color: var(--text-muted); font-weight: 500; }
        .payment-lunas { color: var(--status-success); }
        .payment-unpaid { color: var(--status-cancel); }

        /* Progress Bar Mini */
        .mini-progress-wrap { padding: 10px 18px 0; }
        .mini-progress-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
        .mini-progress-track { height: 4px; background: #1a1a1a; border-radius: 10px; overflow: hidden; }
        .mini-progress-fill { height: 100%; background: var(--accent-gold); border-radius: 10px; }

        /* Body Grid 2 Kolom */
        .card-body { padding: 18px; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .detail-item span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .detail-item strong { font-size: 12px; color: white; word-break: break-all; }

        /* Footer Kartu */
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border-color); padding-top: 15px; }
        .price-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
        .price-value { font-family: var(--font-serif); font-size: 18px; color: var(--accent-gold); font-weight: 700; }
        
        .action-buttons { display: flex; gap: 8px; }
        .btn-action { background: transparent; border: 1px solid var(--border-color); color: white; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-block; }
        .btn-action:hover { background: white; color: black; }
        .btn-action.primary { background: white; color: black; border-color: white; }
        .btn-action.primary:hover { background: #e5e7eb; }

        /* EMPTY STATE */
        .empty-state { display: none; text-align: center; padding: 50px 20px; border: 1px dashed var(--border-color); border-radius: 12px; margin-top: 10px; }
        .empty-state.show { display: block; }
        .empty-state svg { width: 50px; height: 50px; color: var(--text-muted); margin-bottom: 15px; opacity: 0.3; }
        .empty-state h3 { font-family: var(--font-serif); font-size: 18px; color: white; margin-bottom: 5px; }
        .empty-state p { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
    </style>
</head>
<body>

    <main class="container">
        <header class="page-header">
            <div class="page-title">
                <h1>Pesanan Saya</h1>
                <p>Riwayat transaksi akun Anda</p>
            </div>
            <button id="refreshOrders" class="btn-refresh" title="Muat Ulang" type="button" aria-label="Muat ulang pesanan">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            </button>
        </header>

        <!-- FILTER TABS -->
        <div class="filter-tabs" role="group" aria-label="Filter pesanan">
            <button class="filter-btn active" data-filter="all" type="button" aria-pressed="true">Semua</button>
            <button class="filter-btn" data-filter="process" type="button" aria-pressed="false">Proses</button>
            <button class="filter-btn" data-filter="success" type="button" aria-pressed="false">Selesai</button>
        </div>

        <!-- STATE & LIST CONTAINER -->
        <div id="ordersState" style="display:none;" role="status" aria-live="polite"></div>
        <section id="ordersList" aria-live="polite">
            <!-- Kartu pesanan akan di-render oleh your-order.js di sini -->
        </section>

        <!-- EMPTY STATE -->
        <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            <h3>Belum Ada Pesanan</h3>
            <p>Kamu belum pernah melakukan pemesanan joki.</p>
            <a href="/index.html" class="btn-action primary" style="padding: 12px 24px;">Mulai Pesan Sekarang</a>
        </div>

    </main>

    <!-- JS Asli -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/access-guard.js?v=20261106-3"></script>
    <script src="/assets/js/session-manager.js"></script>
    <script src="/assets/js/your-order.js?v=20261104-4"></script>
    <script src="/assets/js/maintenance-status.js?v=20261106-mm2"></script>
</body>
</html>
