<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="assets/css/auth.css?v=20261104-2">

  <script defer src="assets/js/supabase.js"></script>

<body class="auth-page register-page">
  <main class="auth-shell">
    <a class="back-link" href="index.html">← Kembali ke beranda</a>
    <section class="auth-container">
      <div class="crown" aria-hidden="true">♛</div>
      <p class="eyebrow">JOIN THE DRAGON KINGDOM</p>
      <h1>BUAT AKUN</h1>
      <p class="intro">Daftar untuk menjadi bagian dari komunitas Matthew Joki.</p>
      <form id="registerForm" class="auth-form">
        <label for="registerName">Nama lengkap</label>
        <input id="registerName" name="name" type="text" placeholder="Nama kamu" autocomplete="name" maxlength="80" required>
        <label for="registerEmail">Email</label>
        <input id="registerEmail" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
        <label for="registerPassword">Password</label>
        <input id="registerPassword" name="password" type="password" placeholder="Minimal 6 karakter" autocomplete="new-password" minlength="6" required>
        <label for="registerConfirmPassword">Konfirmasi password</label>
        <input id="registerConfirmPassword" name="confirmPassword" type="password" placeholder="Tulis ulang password" autocomplete="new-password" minlength="6" required>
        <button id="registerButton" type="submit">BUAT AKUN</button>
      </form>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
      <p class="auth-link">Sudah punya akun? <a href="login.html">Login di sini</a></p>
    </section>
    <footer>© <span data-current-year>2026</span> MATTHEW JOKI · OFFICIAL SERVICE PORTAL</footer>
  </main>
</body>
</html>
