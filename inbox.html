<body>
  <main class="feature-shell">
    <nav class="feature-nav" aria-label="Navigasi MATTHEW">
      <a class="feature-brand" href="/index.html"><span class="brand-mark">M</span><span>MATTHEW <small>JOKI · KINGDOM HUB</small></span></a>

    </nav>
    <header class="feature-heading"><span class="eyebrow">MATTHEW JOKI · COMMUNICATION CENTER</span><h1>INBOX <em>MATTHEW</em></h1><p>Pesan resmi dan pengumuman khusus untuk akun kamu.</p></header>
    <section class="feature-card" id="inboxComposer" hidden>
      <h2>Kirim pesan resmi</h2>
      <form id="inboxSendForm">
        <label>Judul<input name="title" minlength="3" maxlength="120" required></label>
        <label>Isi pesan<textarea name="body" minlength="1" maxlength="4000" rows="4" required></textarea></label>
        <label>Penerima<select name="audience"><option value="all">Semua member dan role</option><option value="user">Satu penerima</option></select></label>
        <label id="recipientField" hidden>Nama penerima<select name="recipient_id"></select></label>
        <button class="primary-button" type="submit">KIRIM PESAN</button>
        <p id="inboxFeedback" class="feature-state" role="status" aria-live="polite"></p>
      </form>
    </section>
    <div id="inboxState" class="feature-state" role="status" aria-live="polite">Memuat Inbox…</div>
    <section id="inboxList" class="inbox-list" aria-label="Daftar pesan"></section>
  </main>
</body>
