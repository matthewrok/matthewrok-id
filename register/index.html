<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Buat akun Matthew Joki — Shadow Reign Member Access.">
    <link rel="icon" type="image/png" href="/assets/images/brand/logo-matthew.png">
    <link rel="canonical" href="https://matthewrok.my.id/register/">
    <title>Buat Akun - Matthew Joki</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #0a0a0a;
            --bg-input: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #262626;
            --accent-gold: #d4af37;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: var(--font-sans); 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 30px 15px; 
        }

        .container { width: 100%; max-width: 440px; margin: auto; }

        /* KARTU FORM */
        .form-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 20px; 
            padding: 35px 25px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.6); 
            position: relative;
            overflow: hidden;
        }
        
        /* Efek Glow di belakang */
        .form-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: #3b82f6; filter: blur(90px); opacity: 0.15; z-index: 0; }

        /* HEADER FORM */
        .form-header { text-align: center; margin-bottom: 30px; position: relative; z-index: 1; }
        
        /* Container Logo */
        .logo-wrapper {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px auto;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            overflow: hidden;
        }
        .form-logo { width: 100%; height: 100%; object-fit: cover; }

        .form-eyebrow { display: flex; justify-content: center; align-items: center; gap: 6px; color: var(--accent-gold); font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
        .form-eyebrow::before { content: ''; display: block; width: 5px; height: 5px; background: var(--accent-gold); }
        
        .form-title { font-family: var(--font-serif); font-size: 28px; font-weight: 400; margin-bottom: 8px; letter-spacing: 1px; }
        .form-desc { color: var(--text-muted); font-size: 13px; line-height: 1.5; }

        /* INPUT GROUP */
        .input-group { margin-bottom: 18px; position: relative; z-index: 1; }
        .input-group label { display: block; font-size: 11px; font-weight: 500; color: #e5e7eb; margin-bottom: 8px; margin-left: 2px; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 15px; color: var(--text-muted); width: 16px; height: 16px; pointer-events: none; }
        
        .form-control { 
            width: 100%; 
            background: var(--bg-input); 
            border: 1px solid var(--border-color); 
            color: white; 
            padding: 14px 45px 14px 45px; 
            border-radius: 8px; 
            font-family: var(--font-sans); 
            font-size: 13px; 
            outline: none; 
            transition: 0.3s; 
        }
        .form-control:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1); }
        .form-control::placeholder { color: #6b7280; }

        /* Ikon Mata */
        .toggle-password { position: absolute; right: 15px; background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; padding: 0; }
        .toggle-password:hover { color: white; }
        .toggle-password svg { width: 16px; height: 16px; }

        /* PESAN ERROR */
        #error-message { display: none; padding: 10px; border-radius: 6px; font-size: 12px; line-height: 1.5; margin-bottom: 20px; text-align: center; z-index: 1; position: relative; }
        #error-message.status-error { background: rgba(220, 38, 38, 0.1); border: 1px solid #dc2626; color: #f87171; }
        #error-message.status-success { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, .55); color: #93c5fd; }

        /* TOMBOL SUBMIT */
        .btn-submit { 
            width: 100%; 
            background: white; 
            color: black; 
            border: none; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 700; 
            letter-spacing: 1px; 
            cursor: pointer; 
            transition: 0.2s; 
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }
        .btn-submit:hover { background: #e5e7eb; }
        .btn-submit:disabled { opacity: .65; cursor: wait; }

        /* FOOTER FORM */
        .form-footer { text-align: center; margin-top: 25px; font-size: 12px; color: var(--text-muted); position: relative; z-index: 1; }
        .form-footer a { color: white; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; transition: 0.3s; }
        .form-footer a:hover { color: var(--accent-gold); }

        /* Status autentikasi dan tombol kirim ulang verifikasi */
        #authMessage { display: none; }
        .auth-resend-button { width: 100%; margin: 12px 0 0; padding: 11px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-input); color: var(--accent-gold); font: 600 11px var(--font-sans); letter-spacing: .5px; cursor: pointer; }
        .auth-resend-button:disabled { opacity: .65; cursor: wait; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kartu Register -->
        <div class="form-card">
            <div class="form-header">
                
                <!-- LOGO DIBUNGKUS RAPI -->
                <div class="logo-wrapper">
                    <img src="https://matthewrok.my.id/assets/images/brand/logo-matthew.png" alt="Logo Matthew" class="form-logo">
                </div>

                <div class="form-eyebrow">Member Access</div>
                <h1 class="form-title">BUAT AKUN.</h1>
                <p class="form-desc">Bergabunglah untuk mengelola pesanan Anda.</p>
            </div>

            <div id="error-message" role="alert" aria-live="polite"></div>
            <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>

            <form id="registerForm">
                <!-- Nama Lengkap -->
                <div class="input-group">
                    <label for="nama">Nama Lengkap</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="nama" name="name" class="form-control" placeholder="Masukkan nama kamu" autocomplete="name" maxlength="80" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" name="email" class="form-control" placeholder="nama@email.com" autocomplete="email" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Minimal 6 karakter" autocomplete="new-password" minlength="6" required>
                        <button type="button" class="toggle-password" data-toggle-password="password" aria-label="Tampilkan password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <!-- Konfirmasi Password -->
                <div class="input-group">
                    <label for="confirm-password">Konfirmasi Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="confirm-password" name="confirmPassword" class="form-control" placeholder="Tulis ulang password" autocomplete="new-password" minlength="6" required>
                        <button type="button" class="toggle-password" data-toggle-password="confirm-password" aria-label="Tampilkan password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button id="registerButton" type="submit" class="btn-submit">BUAT AKUN</button>
            </form>

            <!-- Link Navigasi ke Login -->
            <div class="form-footer">
                Sudah punya akun? <a href="/login/">Login di sini</a>
            </div>
        </div>
    </div>

    <!-- Existing integrations: keep Supabase, monitoring, and auth scripts intact. -->
    <script defer src="https://browser.sentry-cdn.com/8.55.0/bundle.min.js" crossorigin="anonymous"></script>
    <script defer src="/assets/js/sentry-config.js?v=20261107-pr3"></script>
    <script defer src="/assets/js/monitoring.js?v=20261107-pr3"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="/assets/js/supabase.js"></script>
    <script defer src="/assets/js/auth.js?v=20261108-register-shadow-reign"></script>
    <script defer src="/assets/js/session-manager.js"></script>
    <script defer src="/assets/js/maintenance-status.js?v=20261106-mm2"></script>
    <script>
        // Mirror auth.js status messages into the visible error/status area.
        (() => {
            const message = document.getElementById('authMessage');
            const errorBox = document.getElementById('error-message');
            const observer = new MutationObserver(() => {
                const type = message.classList.contains('error') ? 'error' : (message.classList.contains('success') ? 'success' : '');
                const text = message.textContent.trim();
                errorBox.textContent = text;
                errorBox.className = type ? 'status-' + type : '';
                errorBox.style.display = text ? 'block' : 'none';
            });
            observer.observe(message, {childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class']});
        })();
    </script>
</body>
</html>
